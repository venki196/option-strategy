 <head>

  <style>
:root{--bg:#f2f5f9;--card:#fff;--ink:#0f1b2d;--mut:#64748b;--line:#e2e8f0;--tile:#f1f5f9;--acc:#2563eb;--acc2:#1d4ed8;--ce:#2563eb;--pe:#d97706;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--pur:#7c3aed;--shadow:0 1px 2px rgba(15,27,45,.06),0 4px 14px rgba(15,27,45,.06);color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0a111d;--card:#121b2c;--ink:#e6edf7;--mut:#8aa0bd;--line:#223049;--tile:#182338;--acc:#4f8cff;--acc2:#3b7bf5;--ce:#6aa0ff;--pe:#fbbf24;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--pur:#a78bfa;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 12px calc(env(safe-area-inset-bottom) + 20px)}
.hero{display:flex;align-items:center;justify-content:space-between;margin:14px 0 4px}
.brand{font:700 22px Georgia,serif;letter-spacing:.2px}.brand b{color:var(--acc)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--tile);color:var(--mut);border:1px solid var(--line)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:inline-block}
.pill.live{color:var(--ok)}.pill.live i{background:var(--ok);box-shadow:0 0 0 3px rgba(22,163,74,.25)}
.pill.auto{color:var(--warn)}.pill.auto i{background:var(--warn)}
h2{font:700 15px system-ui,sans-serif;margin:0 0 10px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--acc);flex:none}
.sub{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0;box-shadow:var(--shadow)}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--tile);color:var(--ink);font-size:15px;outline:none}
input:focus,select:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.2)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
button{padding:12px;border:0;border-radius:12px;background:linear-gradient(180deg,var(--acc),var(--acc2));color:#fff;font-size:15px;font-weight:700;width:100%;margin-top:10px;box-shadow:0 2px 8px rgba(37,99,235,.35);transition:transform .08s,filter .15s}
button:active{transform:scale(.98);filter:brightness(.94)}
button.alt{background:var(--tile);color:var(--ink);border:1px solid var(--line);box-shadow:none}
button.live{background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff;box-shadow:0 2px 8px rgba(220,38,38,.4)}
button.warnb{background:linear-gradient(180deg,#f59e0b,#d97706);color:#fff;box-shadow:0 2px 8px rgba(217,119,6,.4)}
button.okb{background:linear-gradient(180deg,#22c55e,#16a34a);color:#fff;box-shadow:0 2px 8px rgba(22,163,74,.4)}
.btns{display:flex;gap:8px}.btns button{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:auto;margin:0;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700;background:var(--tile);color:var(--mut);border:1px solid var(--line);box-shadow:none}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 2px 8px rgba(37,99,235,.3)}
.chip[data-v="Bullish"].on,.chip[data-v="live"].on{background:var(--ok);border-color:var(--ok)}
.chip[data-v="Bearish"].on{background:var(--bad);border-color:var(--bad)}
.chip[data-v="Volatile"].on{background:var(--warn);border-color:var(--warn)}
.chip[data-v="Futures + hedge"].on{background:var(--pur);border-color:var(--pur)}
.sr{display:none}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv>div{background:var(--tile);border-radius:12px;padding:10px 12px}
.kv b{display:block;font-size:18px;font-variant-numeric:tabular-nums;margin-top:2px}.kv span{font-size:11px;color:var(--mut);font-weight:600}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
td,th{padding:5px 6px;text-align:right;white-space:nowrap}
td.k{text-align:center;font-weight:700}tr.atm td.k{background:var(--acc);color:#fff;border-radius:6px}
tr+tr td{border-top:1px solid var(--line)}
td.c,td.p{position:relative;z-index:0}td i{position:absolute;top:4px;bottom:4px;z-index:-1;opacity:.25;border-radius:3px}
td.c i{right:0;background:var(--ce)}td.p i{left:0;background:var(--pe)}
.leg{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:7px 0;gap:8px}
.leg input{width:104px;padding:7px 9px;text-align:right}
.buy{color:var(--ok)}.sell{color:var(--bad)}#err{color:var(--bad);font-size:13px;white-space:pre-wrap}
.hide{display:none}small{color:var(--mut)}.warn{color:var(--bad);font-size:13px}
.res{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;background:var(--tile);border-radius:12px;padding:10px;margin-top:10px}
.chk{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0;font-weight:500}.chk input{width:auto}

 <body>
  <div class="hero">
   <div class="brand">
    Kotak Neo <b>Options</b>
   </div>
   <span class="pill" id="stp"><i></i><span id="stt">Offline</span></span>
  </div>
  <p class="sub">Option chain, strategies by market view, Nifty futures with hedge, live ticks and order ticket.</p>
  <div class="card" id="login">
   <h2>Connect</h2>
   <label>Consumer key (Neo app → More → Trade API)</label><input id="ck" type="password" autocomplete="off">
   <div class="row">
    <div>
     <label>UCC</label><input id="ucc">
    </div>
    <div>
     <label>Mobile (+91…)</label><input id="mob" inputmode="tel">
    </div>
   </div>

    <div>
     <label>TOTP (6 digits)</label><input id="totp" inputmode="numeric" maxlength="6">
    </div>
    <div>
     <label>MPIN</label><input id="mpin" type="password" inputmode="numeric">
    </div>
   </div>
   <button id="go">Log in</button>

  </div>
  <div class="card hide" id="ctl">

   <div class="chips" id="symC"></div>
   <select id="sym" class="sr"><option>NIFTY</option><option>BANKNIFTY</option><option>FINNIFTY</option><option>MIDCPNIFTY</option><option>SENSEX</option></select> <label>Expiry</label><select id="exp"></select> <label>Updates</label>
   <div class="chips" id="modeC"></div>
   <select id="mode" class="sr"><option value="manual">Manual</option><option value="auto">Auto 5 s</option><option value="live">Live ticks</option></select>
   <div class="btns">
    <button class="alt" id="load">⟳ Refresh</button>
    <button class="alt" id="fundsb">₹ Funds</button>
   </div>
   <p id="funds" class="sub" style="margin:10px 0 0"></p>
   <p id="wsst" class="sub" style="margin:4px 0 0"></p>
   <p id="err2" class="warn"></p>
  </div>
  <div id="out"></div>
  <script>
const $=id=>document.getElementById(id),S={},M={},LOT={NIFTY:65,BANKNIFTY:30,FINNIFTY:60,MIDCPNIFTY:120,SENSEX:20},MAXLOTS=20;
['ck','ucc','mob'].forEach(i=>{try{$(i).value=localStorage.getItem('os_'+i)||''}catch{}});
 
async function http(method,url,headers,body){
  const form=/x-www-form-urlencoded/.test(headers['Content-Type']||'');
  const C=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
  if(C){const r=await C.request({method,url,headers,data:body});
    if(r.status>=400)throw new Error(r.status+' '+JSON.stringify(r.data).slice(0,300));return r.data}
  const r=await fetch(url,{method,headers,body:body==null?undefined:form?new URLSearchParams(body).toString():JSON.stringify(body)});
  const t=await r.text();if(!r.ok)throw new Error(r.status+' '+t.slice(0,300));
  try{return JSON.parse(t)}catch{return t}
}
 
const IDX={
  NIFTY:{seg:'nse_fo',spot:['nse_cm|Nifty 50']},
  BANKNIFTY:{seg:'nse_fo',spot:['nse_cm|Nifty Bank']},
  FINNIFTY:{seg:'nse_fo',spot:['nse_cm|Nifty Fin Service','nse_cm|FINNIFTY']},
  MIDCPNIFTY:{seg:'nse_fo',spot:['nse_cm|NIFTY MID SELECT','nse_cm|Nifty Midcap Select']},
  SENSEX:{seg:'bse_fo',spot:['bse_cm|SENSEX','bse_cm|Sensex']}
};
const LOGIN='https://mis.kotaksecurities.com/login/1.0/';
const sid=()=>S.hs?'?sId='+encodeURIComponent(S.hs):'';
const Kotak={
  async login(){
    const H={Authorization:S.ck,'neo-fin-key':'neotradeapi','Content-Type':'application/json'};
    let r=await http('POST',LOGIN+'tradeApiLogin',H,{mobileNumber:S.mob,ucc:S.ucc,totp:$('totp').value.trim()});
    let d=r.data||{};
    r=await http('POST',LOGIN+'tradeApiValidate',{...H,sid:d.sid,Auth:d.token},{mpin:$('mpin').value.trim()});
    d=r.data||{};S.base=d.baseUrl;S.tok=d.token;S.sid=d.sid;S.feed=d.feedUrl;S.hs=d.hsServerId;
    if(!S.base)throw new Error('No baseUrl: '+JSON.stringify(r).slice(0,200));
  },
  H(){return{Authorization:S.ck}},
  TH(){return{Authorization:S.ck,Auth:S.tok,Sid:S.sid,'neo-fin-key':'neotradeapi','Content-Type':'application/x-www-form-urlencoded'}},
  async master(seg){
    const r=await http('GET',S.base+'/script-details/1.0/masterscrip/file-paths',this.H());
    const u=((r.data&&r.data.filesPaths)||[]).find(x=>new RegExp(seg,'i').test(x));
    if(!u)throw new Error(seg+' scrip master not found');
    const c=await http('GET',u,{});return typeof c==='string'?c:''
  },
  async quotes(list){
    const out=[];
    for(let i=0;i<list.length;i+=25){
      const q=encodeURIComponent(list.slice(i,i+25).join(','));
      const r=await http('GET',S.base+'/script-details/1.0/quotes/neosymbol/'+q+'/all',this.H());
      out.push(...(Array.isArray(r)?r:(r.data||[])));
    }return out
  },
  async hist(sym,interval,from,to){
    const U=S.base+'/market-data/1.0/historical/details',qs=o=>Object.entries(o).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    const hs=[this.H(),{Authorization:S.ck,Auth:S.tok,Sid:S.sid,'neo-fin-key':'neotradeapi'}];
    const ps=[{neosymbol:sym,interval,from_date:from,to_date:to},{neosymbol:sym,interval,from,to},{symbol:sym,interval,from_date:from,to_date:to}];
    let last='';
    for(const hi of (S.hh!=null?[S.hh]:[0,1]))for(const pi of (S.hp!=null?[S.hp]:[0,1,2])){
      try{const r=await http('GET',U+'?'+qs(ps[pi]),hs[hi]),c=r&&((r.data&&r.data.candles)||r.candles);
        if(Array.isArray(c)){S.hh=hi;S.hp=pi;return c}last=JSON.stringify(r).slice(0,160)}catch(e){last=String(e.message||e).slice(0,160)}}
    throw new Error('history: '+(last||'no candles'))
  },
  limits(){return http('POST',S.base+'/quick/user/limits'+sid(),this.TH(),{jData:JSON.stringify({seg:'ALL',exch:'ALL',prod:'ALL'})})},
  order(o){return http('POST',S.base+'/quick/order/rule/ms/place'+sid(),this.TH(),{jData:JSON.stringify(o)})},
  check(o){return http('POST',S.base+'/quick/user/check-margin'+sid(),this.TH(),{jData:JSON.stringify(o)})}
};
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const qLtp=q=>num(q.ltp??q.last_traded_price),qOi=q=>num(q.open_int??q.oi??q.openInterest),qTok=q=>String(q.exchange_token??q.instrument_token??''),qBid=q=>num(q.depth&&q.depth.buy&&q.depth.buy[0]&&q.depth.buy[0].price),qAsk=q=>num(q.depth&&q.depth.sell&&q.depth.sell[0]&&q.depth.sell[0].price);
 
function cols(csv){const L=csv.split(/\r?\n/),h=L[0].split(',').map(s=>s.trim().replace(/;$/,''));
  const ix=n=>h.findIndex(x=>x.toLowerCase()===n.toLowerCase());
  return{L,h,tok:ix('pSymbol'),name:ix('pSymbolName'),ts:ix('pTrdSymbol'),typ:ix('pOptionType'),k:ix('dStrikePrice'),e:ix('lExpiryDate'),it:ix('pInstType')}}
function parseMaster(csv,sym){
  const a=cols(csv),rows=[];
  for(let i=1;i<a.L.length;i++){const c=a.L[i].split(',');if(c.length<a.h.length-1)continue;
    if(c[a.name]!==sym||!/^(CE|PE)$/.test(c[a.typ]))continue;
    const e=num(c[a.e]);rows.push({tok:c[a.tok],ts:(c[a.ts]||'').trim(),type:c[a.typ],k:num(c[a.k])/100,exp:e+(e<1.6e9?315513600:0)})}
  return rows
}
function parseFut(csv,sym){
  const a=cols(csv),r=[];
  for(let i=1;i<a.L.length;i++){const c=a.L[i].split(',');if(c.length<a.h.length-1||c[a.name]!==sym)continue;
    const it=a.it>=0?c[a.it]:'',ty=c[a.typ];if(!(/^FUT/i.test(it)||ty==='XX'))continue;
    const e=num(c[a.e]);r.push({tok:c[a.tok],ts:(c[a.ts]||'').trim(),exp:e+(e<1.6e9?315513600:0)})}
  return r
}
function names(csv){const a=cols(csv);return[...new Set(a.L.slice(1,4000).map(l=>l.split(',')[a.name]))].slice(0,12).join(', ')}
const fmtD=s=>new Date(s*1000).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'2-digit',timeZone:'UTC'});
 
/* ---------- analytics ---------- */
function analyse(rows,spot){
  const ks=rows.map(r=>r.k),s=Math.min(...ks.slice(1).map((k,i)=>k-ks[i]).filter(d=>d>0));
  const atm=ks.reduce((b,k)=>Math.abs(k-spot)<Math.abs(b-spot)?k:b,ks[0]);
  const sum=f=>rows.reduce((t,r)=>t+f(r),0),coi=sum(r=>r.ce.oi),poi=sum(r=>r.pe.oi);
  let mp=ks[0],best=Infinity;
  for(const K of ks){const l=sum(r=>r.ce.oi*Math.max(0,K-r.k)+r.pe.oi*Math.max(0,r.k-K));if(l<best){best=l;mp=K}}
  const up=rows.filter(r=>r.k>=atm),dn=rows.filter(r=>r.k<=atm);
  const cw=up.reduce((b,r)=>r.ce.oi>b.ce.oi?r:b,up[0]).k,pw=dn.reduce((b,r)=>r.pe.oi>b.pe.oi?r:b,dn[0]).k;
  const a=rows.find(r=>r.k===atm);
  return{s,atm,pcr:coi?poi/coi:0,mp,cw,pw,straddle:a.ce.ltp+a.pe.ltp,ks}
}
function parity(rows){let b=null;for(const r of rows)if(r.ce.ltp>0&&r.pe.ltp>0){const d=Math.abs(r.ce.ltp-r.pe.ltp);if(!b||d<b.d)b={d,s:r.k+r.ce.ltp-r.pe.ltp}}return b&&b.s}
 
const LIB={
Bullish:{
 'Bull put spread':c=>[['SELL',c.pw,'PE'],['BUY',c.sn(c.pw-2*c.s),'PE']],
 'Bull call spread':c=>[['BUY',c.atm,'CE'],['SELL',c.cw>c.atm?c.cw:c.sn(c.atm+4*c.s),'CE']],
 'Long call':c=>[['BUY',c.atm,'CE']]},
Bearish:{
 'Bear call spread':c=>[['SELL',c.cw,'CE'],['BUY',c.sn(c.cw+2*c.s),'CE']],
 'Bear put spread':c=>[['BUY',c.atm,'PE'],['SELL',c.pw<c.atm?c.pw:c.sn(c.atm-4*c.s),'PE']],
 'Long put':c=>[['BUY',c.atm,'PE']]},
Neutral:{
 'Iron condor':c=>[['SELL',c.pw,'PE'],['BUY',c.sn(c.pw-2*c.s),'PE'],['SELL',c.cw,'CE'],['BUY',c.sn(c.cw+2*c.s),'CE']],
 'Iron butterfly':c=>[['SELL',c.atm,'CE'],['SELL',c.atm,'PE'],['BUY',c.sn(c.atm+3*c.s),'CE'],['BUY',c.sn(c.atm-3*c.s),'PE']],
 'Short strangle (undefined risk)':c=>[['SELL',c.cw,'CE'],['SELL',c.pw,'PE']]},
Volatile:{
 'Long straddle':c=>[['BUY',c.atm,'CE'],['BUY',c.atm,'PE']],
 'Long strangle':c=>[['BUY',c.sn(c.atm+2*c.s),'CE'],['BUY',c.sn(c.atm-2*c.s),'PE']],
 'Reverse iron condor':c=>[['BUY',c.sn(c.atm+2*c.s),'CE'],['SELL',c.sn(c.atm+4*c.s),'CE'],['BUY',c.sn(c.atm-2*c.s),'PE'],['SELL',c.sn(c.atm-4*c.s),'PE']]},
'Futures + hedge':{
 'Auto (by option data)':c=>c.dir.call==='Bullish'?[['BUY',hk(c,'put'),'PE'],['BUY','FUT','FUT']]:c.dir.call==='Bearish'?[['BUY',hk(c,'call'),'CE'],['SELL','FUT','FUT']]:[],
 'Long future + long put':c=>[['BUY',hk(c,'put'),'PE'],['BUY','FUT','FUT']],
 'Short future + long call':c=>[['BUY',hk(c,'call'),'CE'],['SELL','FUT','FUT']]}
};
function pay(legs,x){return legs.reduce((a,l)=>{if(l.t==='FUT')return a+(l.d==='BUY'?x-l.k:l.k-x);const v=l.t==='CE'?Math.max(0,x-l.k):Math.max(0,l.k-x);return a+(l.d==='BUY'?v-l.p:l.p-v)},0)}
function profile(legs){
  const ks=[...new Set(legs.map(l=>l.k))].sort((a,b)=>a-b),pts=[0,...ks],ys=pts.map(x=>pay(legs,x)),top=ks[ks.length-1];
  const sl=pay(legs,top+1)-pay(legs,top);let mx=Math.max(...ys),mn=Math.min(...ys);
  if(sl>1e-9)mx=Infinity;if(sl<-1e-9)mn=-Infinity;
  const be=[];for(let i=0;i<pts.length-1;i++){const a=ys[i],b=ys[i+1];if(a*b<0)be.push(pts[i]-a*(pts[i+1]-pts[i])/(b-a))}
  if(ys[ys.length-1]*sl<0)be.push(top-ys[ys.length-1]/sl);
  return{mx,mn,be}
}
 
/* ---------- render ---------- */
let ST=null;
const n0=v=>Math.round(v).toLocaleString('en-IN'),inr=v=>Math.abs(v)===Infinity?'Unlimited':'₹'+n0(v),tick=p=>(Math.round(p/0.05)*0.05).toFixed(2);
const tk2=(l,p)=>l.t==='FUT'?(Math.round(p/0.1)*0.1).toFixed(2):tick(p),lbl=x=>x.t==='FUT'?x.d+' FUT':x.d+' '+x.k+' '+x.t,FUTM=0.11;
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Kolkata'});
let SNAP={};try{const j=JSON.parse(localStorage.getItem('os_snap')||'{}');if(j.date===today())SNAP=j.data||{}}catch{}
function snap(){
  const a=SNAP[ST.key]=SNAP[ST.key]||[],n=Date.now();if(a.length&&n-a[a.length-1].t<30000)return;
  const ce={},pe={};ST.rows.forEach(r=>{ce[r.k]=r.ce.oi;pe[r.k]=r.pe.oi});a.push({t:n,ce,pe});while(a.length>120)a.shift();
  try{localStorage.setItem('os_snap',JSON.stringify({date:today(),data:SNAP}))}catch{}
}
function show(rows,spot,note,parityOn,auto,fut){
  const key=$('sym').value+'|'+$('exp').value;
  if(ST&&ST.key===key&&auto&&$('view')){ST.rows=rows;ST.spot=spot;ST.note=note;ST.parity=parityOn;ST.fut=fut||ST.fut;mapRows();paint();return}
  ST={rows,spot,note,parity:parityOn,key,fut};build();paint();setSpec();drawStrat();buildTicket();mapRows();if(!auto)setMode()
}
function build(){
  const A=analyse(ST.rows,ST.spot),bias=A.pcr>=1.2?'Bullish':A.pcr<=0.8?'Bearish':'Neutral';

function quoteOf(b,l){if(!ST)return null;const[k0,k1]=ST.key.split('|');if(k0!==b.sym||k1!==b.exp)return null;

function tryFill(b,l){
  const o=quoteOf(b,l);if(!o)return false;
  const ref=l.d==='BUY'?(o.ask>0?o.ask:o.ltp):(o.bid>0?o.bid:o.ltp);if(!(ref>0))return false;
  if(l.limit==null||(l.d==='BUY'?ref<=l.limit:ref>=l.limit)){l.status='FILLED';l.entry=ref;return true}
  return false
}
function paperTick(){
  let ch=false;

    for(const l of b.legs)if(l.status==='PENDING'&&tryFill(b,l))ch=true;
    if(b.legs.filter(l=>l.d==='BUY').every(l=>l.status==='FILLED'||l.status==='CLOSED'))
      for(const l of b.legs)if(l.status==='WAIT'){l.status='PENDING';ch=true;tryFill(b,l)}}
  if(ch)savePP()
}
function newPaper(ord,q,mkt){

}
function sqoff(id){
  const b=PP.find(x=>x.id===id);if(!b)return;
  const need=b.legs.filter(l=>l.status==='FILLED');
  if(need.some(l=>!(markPx(b,l)>0))){alert('Open '+b.sym+' with the same expiry so a live price is available for square-off.');return}
  b.legs.forEach(l=>{if(l.status==='PENDING'||l.status==='WAIT')l.status='CANCELLED'});
  need.sort((a,c)=>(a.d==='SELL'?0:1)-(c.d==='SELL'?0:1)).forEach(l=>{l.exit=markPx(b,l);l.status='CLOSED'});

}

const ENUM={nse_cm:1,nse_fo:2,cde_fo:3,nse_com:4,bse_cm:5,bse_fo:6,bse_cd:7,bse_co:8,mcx_fo:9,ncd_co:10};

function decode(buf){
  const dv=new DataView(buf);let o=0,hit=false;
  while(o+2<=buf.byteLength){const n=dv.getUint16(o,true);if(n<9||o+n>buf.byteLength)break;
    const mc=dv.getUint16(o+2,true),ex=dv.getInt8(o+4),lv=dv.getUint8(o+5),d=W.div[ex]||100;
    if(mc===7208&&(lv===1||lv===2||lv===4||lv===8)){
      const tok=dv.getUint32(o+9,true),x=W.map[ex+'|'+tok];
      if(x){if(lv===1)x.ltp=dv.getUint32(o+21,true)/d;else{x.ltp=dv.getUint32(o+69,true)/d;x.oi=dv.getUint32(o+103,true)}hit=true}}
    else if(mc===7207&&ST&&!ST.parity){const v=dv.getInt32(o+29,true)/d;if(v>0){ST.spot=v;hit=true}}
    o+=n}
  if(hit)sched()
}

               pe:{oi:Math.max(2e4,(i<=0?1.1e6:3e5)*Math.exp(-((i+4)**2)/30)*(1+(i%2)/7)),ltp:Math.max(1,k-spot+110-d*4)}})}
  return{spot,rows,fut:{ltp:spot+22,ts:'NIFTY FUT'}}
}

function chips(id){

  c.innerHTML=[...(sel.options||[])].map(o=>`<button type="button" class="chip${o.value===sel.value?' on':''}" data-v="${o.value}">${o.text}</button>`).join('');
  [...c.querySelectorAll('button')].forEach(b=>b.onclick=()=>{sel.value=b.dataset.v;if(sel.onchange)sel.onchange();chips(id)})

let busy=false;
async function load(auto){
  if(busy)return;busy=true;
  try{$('err2').textContent='';const sym=$('sym').value,cfg=IDX[sym],ex=+$('exp').value;
    let spot=0;S.spotSym='';
    for(const c of cfg.spot){try{const q=await Kotak.quotes([c]);spot=qLtp(q[0]||{});if(spot){S.spotSym=c;break}}catch{}}
    const all=parseMaster(M[cfg.seg],sym).filter(r=>r.exp===ex),ks=[...new Set(all.map(r=>r.k))].sort((a,b)=>a-b);
    const st=Math.min(...ks.slice(1).map((k,i)=>k-ks[i]).filter(d=>d>0)),ctr=spot||ks[Math.floor(ks.length/2)],w=(spot?12:25)*st;
    const near=all.filter(r=>Math.abs(r.k-ctr)<=w);
    const fx=sym==='NIFTY'?parseFut(M[cfg.seg],sym).filter(f=>f.exp>=ex-86400).sort((a,b)=>a.exp-b.exp)[0]:null;
    const qs=await Kotak.quotes([...near.map(r=>cfg.seg+'|'+r.tok),...(fx?[cfg.seg+'|'+fx.tok]:[])]),byT={};qs.forEach(q=>byT[qTok(q)]=q);
    const m={};near.forEach(r=>{const q=byT[r.tok]||{};(m[r.k]=m[r.k]||{k:r.k})[r.type==='CE'?'ce':'pe']={oi:qOi(q),ltp:qLtp(q),bid:qBid(q),ask:qAsk(q),tok:r.tok,ts:r.ts}});
    let rows=Object.values(m).filter(r=>r.ce&&r.pe).sort((a,b)=>a.k-b.k),note='',par=false;
    if(!spot){const p=parity(rows);if(!p)throw new Error('Could not get spot or option prices (market closed?).');
      spot=p;par=true;rows=rows.filter(r=>Math.abs(r.k-spot)<=12*st);note='Index quote was unavailable, so spot comes from put-call parity (close to the futures price).'}
    const fq=fx&&byT[fx.tok],fut=fq?{ltp:qLtp(fq),oi:qOi(fq),bid:qBid(fq),ask:qAsk(fq),tok:fx.tok,ts:fx.ts}:null;
    if(rows.length<5)throw new Error('Too few strikes parsed; check quote field names in qLtp/qOi.');
    show(rows,spot,note,par,!!auto,fut)
  }catch(e){fail(e)}finally{busy=false}
}
